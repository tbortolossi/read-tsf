name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The manifests do not rot, but a leak can be noticed late. Look weekly.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No customer data
        run: tools/check-no-customer-data.sh

      - name: Shell scripts
        run: shellcheck tools/*.sh plugins/read-tsf/bin/read-tsf-sync

      - name: Manifests, skill and links
        run: tools/validate.sh

      - name: Coverage tool runs
        # There is no TSF to point it at in CI — it must at least refuse
        # cleanly rather than break on a syntax error.
        run: |
          ! tools/coverage.sh 2>/dev/null
          tools/coverage.sh /nonexistent 2>&1 | grep -q "not a directory"

      - name: read-tsf-sync, bash
        run: tools/test-sync.sh bash

      - name: read-tsf-sync, PowerShell 7
        run: tools/test-sync.sh ps

  windows:
    # The machines this has to work on: Windows PowerShell 5.1 as shipped,
    # and Git Bash where Claude Code brought it along.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: read-tsf-sync, Windows PowerShell 5.1
        run: PWSH=powershell.exe READ_TSF_DEBUG=1 tools/test-sync.sh ps

      - name: read-tsf-sync, Git Bash
        if: success() || failure()
        run: tools/test-sync.sh bash
